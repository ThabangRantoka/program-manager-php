<section class="login-page">
  <div class="decoration circle-one" aria-hidden="true"></div>
  <div class="decoration circle-two" aria-hidden="true"></div>

  <main class="login-card">
    <div class="lock-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect
          x="5" y="10" width="14" height="11"
          rx="3" fill="currentColor"
        />
        <path
          d="M8 10V7a4 4 0 0 1 8 0v3"
          stroke="currentColor"
          stroke-width="2.5"
        />
        <circle cx="12" cy="15" r="1.5" fill="#e8edef" />
      </svg>
    </div>

    <p class="brand">PROGRAM MANAGER</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your programmes.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter your username"
          [(ngModel)]="username"
          autocomplete="username"
          maxlength="50"
          [disabled]="loading()"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          autocomplete="current-password"
          [disabled]="loading()"
          required
        >
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">
          {{ errorMessage() }}
        </p>
      }

      <button
        class="login-button"
        type="submit"
        [disabled]="loginForm.invalid || loading()"
      >
        {{ loading() ? 'Logging in...' : 'Log in' }}
      </button>
    </form>

    <p class="account-note">
      Don’t have an account?
      <a href="https://intern1.pfunzo.africa/api/register.php">
        Create account
      </a>
    </p>
  </main>
</section>
