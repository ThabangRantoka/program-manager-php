
name: Program Manager CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-check:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate PHP files
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -print0 | xargs -0 -r -n1 php -l

  angular-build:
    name: Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: program-manager-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: program-manager-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular for production
        run: npm run build -- --configuration production --base-href /app/
